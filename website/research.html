<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Áreas de investigación"
    >

    <title>Investigación | GISET</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body>

<header class="site-header">

    <div class="container nav-container">

        <a href="index.html" class="brand">

            <img
                src="assets/logo/group-logo.png"
                alt="GISET"
                class="brand-logo"
            >

            <div class="brand-text">
                <span
                    class="brand-name"
                    data-group-short-name
                >
                    GISET
                </span>

                <span class="brand-institution">
                    UTP
                </span>
            </div>

        </a>


        <button
            class="mobile-menu-button"
            id="mobileMenuButton"
            aria-label="Abrir menú"
        >
            ☰
        </button>


        <nav
            class="main-nav"
            id="mainNav"
        >

            <a
                href="index.html"
                data-i18n="nav.home"
            >
                Inicio
            </a>

            <a
                href="research.html"
                class="active"
                data-i18n="nav.research"
            >
                Investigación
            </a>

            <a
                href="projects.html"
                data-i18n="nav.projects"
            >
                Proyectos
            </a>

            <a
                href="publications.html"
                data-i18n="nav.publications"
            >
                Publicaciones
            </a>

            <a
                href="team.html"
                data-i18n="nav.team"
            >
                Equipo
            </a>

            <a
                href="collaborators.html"
                data-i18n="nav.collaborators"
            >
                Colaboradores
            </a>

            <a
                href="events.html"
                data-i18n="nav.events"
            >
                Eventos
            </a>

            <a
                href="gallery.html"
                data-i18n="nav.gallery"
            >
                Galería
            </a>

            <a
                href="contact.html"
                data-i18n="nav.contact"
            >
                Contacto
            </a>

            <button
                class="language-switcher"
                id="languageSwitcher"
            >
                EN
            </button>

        </nav>

    </div>

</header>


<main>

    <section class="page-hero">

        <div class="container">

            <span class="eyebrow">
                Investigación
            </span>

            <h1
                data-i18n="research.heading"
            >
                Investigación para resolver desafíos reales
            </h1>

        </div>

    </section>


    <section class="page-content">

        <div class="container">

            <div
                class="research-grid"
                id="researchAreas"
            ></div>

        </div>

    </section>

</main>


<footer class="site-footer">

    <div class="container footer-grid">

        <div>

            <div
                class="footer-brand"
                data-group-short-name
            >
                GISET
            </div>

            <p data-group-description></p>

        </div>

    </div>

</footer>


<script src="js/app.js"></script>

</body>

</html>
